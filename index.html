<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCOTUS Explorer — Every Supreme Court Decision Since 1946</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#faf8f5;--surface:#fff;--surface2:#f3f0eb;--surface3:#e8e4dd;
  --text:#1a1714;--text2:#5c564e;--text3:#8c857b;
  --border:#ddd8d0;--border2:#c8c2b8;
  --accent:#8b6914;--accent2:#b8941e;--accent-light:#f5ecd8;
  --radius:6px;--radius-sm:4px;
}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.loading{text-align:center;padding:4rem 2rem;color:var(--text3)}
.loading-spinner{display:inline-block;width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:1rem}
@keyframes spin{to{transform:rotate(360deg)}}

.header{padding:2.5rem 2rem 1.5rem;text-align:center;border-bottom:1px solid var(--border);background:#fff}
.logo{font-family:'Source Serif 4',Georgia,serif;font-weight:700;font-size:clamp(1.8rem,4vw,2.8rem);letter-spacing:-0.03em;color:var(--text);margin-bottom:0.2rem}
.tagline{color:var(--text3);font-size:0.9rem;margin-bottom:1.5rem}
.tagline strong{color:var(--text2);font-weight:600}
.search-wrap{max-width:560px;margin:0 auto;position:relative}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text3);pointer-events:none}
.search{width:100%;padding:12px 16px 12px 42px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:0.92rem;font-family:inherit;outline:none;transition:all 0.2s}
.search:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(139,105,20,0.08)}
.search::placeholder{color:var(--text3)}

.filters{max-width:1280px;margin:0 auto;padding:1rem 2rem 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filter-group{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.filter-label{font-size:0.72rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--text3);margin-right:4px}
.pill{padding:5px 11px;border-radius:999px;font-size:0.76rem;font-weight:500;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;transition:all 0.15s;user-select:none;font-family:inherit}
.pill:hover{border-color:var(--border2);background:var(--surface2)}
.pill.active{border-color:var(--accent);background:var(--accent-light);color:var(--accent);font-weight:600}
.pill .ct{font-size:0.66rem;color:var(--text3);margin-left:2px}
.pill.active .ct{color:var(--accent)}
.filter-sep{width:1px;height:20px;background:var(--border);margin:0 6px}

.stats-bar{max-width:1280px;margin:0.75rem auto 0;padding:0 2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.stats-count{font-size:0.84rem;color:var(--text3)}
.stats-count strong{color:var(--text);font-weight:600}
.sort-sel{padding:4px 8px;border-radius:var(--radius-sm);font-size:0.76rem;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:inherit;cursor:pointer}

.doctrine{max-width:1280px;margin:0.75rem auto 0;padding:0 2rem;display:none}
.doctrine.show{display:block}
.doctrine-inner{background:var(--accent-light);border:1px solid #e0d5b8;border-left:3px solid var(--accent);border-radius:var(--radius-sm);padding:10px 16px;font-size:0.82rem;color:var(--text2);line-height:1.7}
.doctrine-inner strong{color:var(--text);font-weight:600}

.jp{max-width:1280px;margin:0.75rem auto 0;padding:0 2rem;display:none}
.jp.show{display:block}
.jp-inner{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--radius-sm);padding:14px 18px}
.jp-inner h2{font-family:'Source Serif 4',Georgia,serif;font-size:1.3rem;font-weight:700;margin-bottom:2px}
.jp-meta{font-size:0.82rem;color:var(--text2);margin-bottom:6px}
.jp-stats{display:flex;gap:16px;flex-wrap:wrap}
.jp-stat strong{font-weight:700;color:var(--text)}
.jp-stat span{font-size:0.68rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.04em}

.main{max-width:1280px;margin:1rem auto 0;padding:0 2rem 4rem;min-height:400px}
.cases-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);border-left:3px solid var(--card-accent,var(--border));padding:14px 16px 12px;cursor:pointer;transition:all 0.15s;position:relative}
.card:hover{border-color:var(--border2);box-shadow:0 2px 8px rgba(0,0,0,0.05)}
.card.featured{border-left-width:4px;background:linear-gradient(135deg,#fff 0%,#fdfbf6 100%)}
.card-badges{display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap}
.badge{font-size:0.6rem;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;padding:2px 6px;border-radius:3px}
.badge-landmark{background:var(--accent-light);color:var(--accent);border:1px solid #ddd0a8}
.badge-recent{background:#eef6ff;color:#3b7dd8;border:1px solid #d0e3f7}
.badge-overruled{background:#fff0f0;color:#b84040;border:1px solid #e8c8c8}
.badge-role{font-size:0.6rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:2px 6px;border-radius:3px}
.role-author{background:var(--accent-light);color:var(--accent);border:1px solid #ddd0a8}
.role-concurrence{background:#fff8e1;color:#e65100;border:1px solid #ffe0b2}
.role-dissent{background:#fce4ec;color:#c62828;border:1px solid #f8bbd0}
.role-majority{background:#e8f5e9;color:#2e7d32;border:1px solid #c8e6c9}

.card-name{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:600;font-size:1.15rem;line-height:1.25;margin-bottom:3px;color:var(--text)}
.featured .card-name{font-size:1.25rem;font-weight:700}
.card-meta{display:flex;gap:6px;align-items:center;margin-bottom:6px;font-size:0.74rem;color:var(--text3);font-weight:500}
.card-meta .yr{color:var(--accent);font-weight:700}
.card-meta .dot{opacity:0.3}
.card-holding{font-size:0.85rem;color:var(--text2);line-height:1.6}
.featured .card-holding{color:var(--text)}
.card-tag{display:inline-block;margin-top:8px;font-size:0.68rem;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--surface2);color:var(--text3);border:1px solid var(--border)}
.card-details{display:none;margin-top:12px;border-top:1px solid var(--border);padding-top:10px}
.card.expanded .card-details{display:block}
.det-row{display:flex;gap:6px;margin-bottom:4px;font-size:0.8rem}
.det-label{color:var(--text3);font-weight:600;min-width:80px;font-size:0.66rem;text-transform:uppercase;letter-spacing:0.04em;padding-top:2px;flex-shrink:0}
.det-val{color:var(--text2)}
.det-val em{font-style:italic;color:var(--text)}
.det-links{display:flex;gap:8px;margin-top:8px}
.det-links a{font-size:0.76rem;color:var(--accent);text-decoration:none;font-weight:600}
.det-links a:hover{color:var(--accent2)}

.no-results{text-align:center;padding:3rem 2rem;color:var(--text3);font-size:1rem}
.load-more{text-align:center;padding:2rem}
.load-more .pill{padding:10px 24px;font-size:0.88rem}

.footer{text-align:center;padding:2rem;color:var(--text3);font-size:0.72rem;border-top:1px solid var(--border);max-width:1280px;margin:0 auto}
.footer a{color:var(--text2);text-decoration:none}
.footer a:hover{color:var(--accent)}

@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.card{animation:fadeIn 0.25s ease both}

@media(max-width:768px){
  .header{padding:1.5rem 1rem 1rem}
  .filters,.stats-bar,.doctrine,.jp,.main{padding-left:1rem;padding-right:1rem}
  .cases-grid{grid-template-columns:1fr;gap:10px}
  .filter-sep{display:none}
  .card-name{font-size:1.05rem}
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">SCOTUS Explorer</div>
  <div class="tagline"><strong id="total-count">9,341</strong> Supreme Court decisions since 1946 — searchable by topic, justice, and era</div>
  <div class="search-wrap">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/></svg>
    <input type="text" class="search" id="search" placeholder="Search cases, justices, topics..." autocomplete="off">
  </div>
</div>

<div class="filters" id="filters"></div>
<div class="doctrine" id="doctrine"><div class="doctrine-inner" id="doctrine-text"></div></div>
<div class="jp" id="jp"><div class="jp-inner" id="jp-inner"></div></div>

<div class="stats-bar">
  <div class="stats-count" id="stats"></div>
  <div><select class="sort-sel" id="sort"><option value="year-desc">Newest first</option><option value="year-asc">Oldest first</option><option value="landmark">Featured first</option></select></div>
</div>

<div class="main" id="main"><div class="loading" id="loading"><div class="loading-spinner"></div><br>Loading decisions...</div></div>

<div class="footer">
  Case data from the <a href="https://scdb.la.psu.edu/" target="_blank">Supreme Court Database</a> (2025 Release 01, terms 1946–2024).
  Featured holdings from <a href="https://oyez.org" target="_blank">Oyez</a> &amp;
  <a href="https://www.law.cornell.edu/supremecourt/text" target="_blank">Cornell LII</a>. Not legal advice.
</div>

<script>
const IA_NAMES={1:"Criminal Procedure",2:"Civil Rights",3:"First Amendment",4:"Due Process",5:"Privacy",6:"Attorneys",7:"Unions",8:"Economic Activity",9:"Judicial Power",10:"Federalism",11:"Interstate Relations",12:"Federal Taxation",13:"Miscellaneous",14:"Private Action"};
const IA_COLORS={1:"#8b4040",2:"#8b6914",3:"#9b6b2f",4:"#6b7a99",5:"#8b5e6b",6:"#7a6b8b",7:"#5c7a5c",8:"#7a8b5c",9:"#4a6e8b",10:"#8b7040",11:"#5c8b7a",12:"#6b6b8b",13:"#888",14:"#777"};
const ERAS={"Vinson":"1946–53","Warren":"1953–69","Burger":"1969–86","Rehnquist":"1986–05","Roberts":"2005–now"};
const DOCTRINE={
  3:'<strong>Speech:</strong> "Clear and present danger" → "Imminent lawless action" (Brandenburg) → Broad protection. <strong>Religion:</strong> Lemon test (1971) → Overruled (Kennedy v. Bremerton, 2022).',
  2:'"Separate but equal" (Plessy) → <strong>Brown</strong> (1954) → Strict scrutiny for race → Intermediate for sex → <strong>Race-conscious admissions ended</strong> (SFFA, 2023).',
  5:'Right to privacy (Griswold, 1965) → Abortion right (Roe, 1973) → Undue burden (Casey) → <strong>Roe overturned</strong> (Dobbs, 2022).',
  1:'Exclusionary rule (Mapp) → Miranda warnings (1966) → Digital privacy requires warrants (Riley, Carpenter). Death penalty: moratorium (Furman) → reinstated (Gregg) → limited (Atkins, Roper).',
  4:'"Liberty of contract" era (Lochner) → Right to privacy (Griswold) → Same-sex marriage (Obergefell) → <strong>Dobbs narrowed</strong> unenumerated rights.',
  10:'Federal supremacy → Anti-commandeering (Printz) → <strong>Chevron deference</strong> (1984) → Overruled (Loper Bright, 2024). Major questions doctrine rises.',
  9:'<strong>Judicial review</strong> (Marbury) → Agency deference era → Chevron overruled → Courts exercise independent judgment on statutes.',
};

const FEATURED={};
[
  ["347 U.S. 483","Racial segregation in public schools is inherently unequal and violates the Equal Protection Clause.",1],
  ["369 U.S. 186","Legislative apportionment disputes are justiciable — federal courts can hear redistricting challenges.",1],
  ["370 U.S. 421","Government-directed prayer in public schools violates the Establishment Clause.",1],
  ["372 U.S. 335","States must provide lawyers to defendants who cannot afford them in felony cases.",1],
  ["376 U.S. 254","Public officials must prove 'actual malice' to win defamation suits against the press.",1],
  ["377 U.S. 533","State legislative districts must be roughly equal in population — 'one person, one vote.'",1],
  ["379 U.S. 241","Congress may use the Commerce Clause to ban racial discrimination in public accommodations.",1],
  ["381 U.S. 479","The Constitution protects marital privacy, prohibiting states from banning contraceptive use.",1],
  ["384 U.S. 436","Police must inform suspects of their right to remain silent and right to an attorney before interrogation.",1],
  ["388 U.S. 1","Laws banning interracial marriage violate both Equal Protection and Due Process.",1],
  ["389 U.S. 347","The Fourth Amendment protects reasonable expectations of privacy, not just physical spaces.",1],
  ["392 U.S. 1","Police may stop and frisk based on reasonable suspicion of criminal activity.",1],
  ["393 U.S. 503","Students do not shed their First Amendment rights at the schoolhouse gate.",1],
  ["395 U.S. 444","Speech can only be restricted if directed to inciting imminent lawless action.",1],
  ["403 U.S. 713","Government failed to justify prior restraint on publishing the Pentagon Papers.",1],
  ["404 U.S. 71","First time the Court struck down a law for sex discrimination under Equal Protection.",1],
  ["408 U.S. 238","Arbitrary death penalty imposition violates the Eighth Amendment — moratorium imposed.",1],
  ["410 U.S. 113","Constitution protects abortion rights before viability, grounded in right to privacy.",1,"Dobbs (2022)"],
  ["418 U.S. 683","Executive privilege is not absolute — President must comply with criminal subpoenas.",1],
  ["428 U.S. 153","Death penalty is not inherently cruel and unusual under reformed sentencing guidelines.",1],
  ["438 U.S. 265","Racial quotas are unconstitutional, but race may be one admissions factor.",1],
  ["457 U.S. 202","States cannot deny public education to undocumented immigrant children.",1],
  ["462 U.S. 919","Legislative veto is unconstitutional — Congress cannot override executive action by one-house resolution.",1],
  ["467 U.S. 837","Courts should defer to agencies' reasonable interpretations of ambiguous statutes.",1,"Loper Bright (2024)"],
  ["476 U.S. 79","Using peremptory challenges to exclude jurors based on race violates Equal Protection.",1],
  ["491 U.S. 397","Flag burning is constitutionally protected symbolic speech.",1],
  ["494 U.S. 872","Neutral laws that incidentally burden religion need not meet strict scrutiny.",1],
  ["505 U.S. 833","Reaffirmed Roe's core but replaced trimester framework with 'undue burden' standard.",1,"Dobbs (2022)"],
  ["514 U.S. 549","Commerce power has limits — Congress cannot regulate gun possession near schools.",1],
  ["518 U.S. 515","VMI's male-only admissions violates Equal Protection.",1],
  ["521 U.S. 898","Federal government cannot commandeer state officers to enforce federal programs.",1],
  ["531 U.S. 98","Florida recount lacked uniform standards — decided the 2000 presidential election.",1],
  ["539 U.S. 244","Race-conscious admissions can survive strict scrutiny as compelling interest.",0,"SFFA v. Harvard (2023)"],
  ["539 U.S. 558","Consenting adults have the right to private intimate conduct; anti-sodomy laws unconstitutional.",1],
  ["543 U.S. 551","Eighth Amendment forbids executing offenders under 18 at time of crime.",1],
  ["554 U.S. 570","Second Amendment protects individual right to possess firearms for self-defense.",1],
  ["558 U.S. 310","Corporate political spending is protected speech — cannot restrict independent expenditures.",1],
  ["561 U.S. 742","Second Amendment applies to state and local governments through the 14th Amendment.",1],
  ["567 U.S. 519","ACA mandate sustained as tax; Commerce Clause cannot compel purchases.",1],
  ["570 U.S. 529","Voting Rights Act preclearance formula unconstitutional — based on outdated data.",1],
  ["570 U.S. 744","DOMA's marriage definition denies equal liberty to same-sex couples.",1],
  ["573 U.S. 373","Police generally need a warrant to search a cell phone seized during arrest.",1],
  ["576 U.S. 644","Same-sex couples have fundamental right to marry under Due Process and Equal Protection.",1],
  ["585 U.S. 296","Government needs a warrant for cell-site location records.",1],
  ["588 U.S. 684","Partisan gerrymandering claims are nonjusticiable political questions.",1],
  ["590 U.S. 644","Title VII's ban on sex discrimination encompasses sexual orientation and gender identity.",1],
  ["597 U.S. 1","Government must show firearm regulations consistent with historical tradition; NY law struck down.",1],
  ["597 U.S. 215","No constitutional right to abortion — Roe and Casey overruled, authority returned to states.",1],
  ["597 U.S. 507","Coach's post-game prayers are protected speech; Lemon test overruled.",1],
  ["597 U.S. 697","Agencies cannot claim broad regulatory authority on major questions without clear congressional authorization.",1],
  ["599 U.S. 1","State courts may review legislatures' election regulation — independent state legislature theory rejected.",1],
  ["600 U.S. 181","Race-based admissions violate Equal Protection — universities may not use race as factor.",1],
  ["601 U.S. 100","States cannot disqualify presidential candidates under 14th Amendment Section 3 — only Congress can.",1],
  ["602 U.S. 369","Chevron deference overruled — courts must exercise independent judgment interpreting statutes.",1],
  ["603 U.S. 593","Former presidents have absolute immunity for core constitutional acts, presumptive immunity for official acts.",1],
].forEach(([cite,holding,lm,overruled])=>{FEATURED[cite]={holding,landmark:!!lm,overruled:overruled||null}});

let ALL=[];
let state={query:'',ia:null,era:null,justice:null,sort:'year-desc',expanded:null,page:0};
const PAGE=60;

async function loadData(){
  const r=await fetch('scdb.json');
  const d=await r.json();
  ALL=d.cases.map(c=>{const f=FEATURED[c.c];return{...c,holding:f?.holding||'',landmark:f?.landmark||false,overruled:f?.overruled||null,featured:!!f}});
  document.getElementById('total-count').textContent=ALL.length.toLocaleString();
  init();
}

function matchJ(c,n){return c.a===n||(c.con&&c.con.includes(n))||(c.dis&&c.dis.includes(n))||(c.maj&&c.maj.includes(n))}
function roleJ(c,n){if(c.a===n)return'author';if(c.con&&c.con.includes(n))return'concurrence';if(c.dis&&c.dis.includes(n))return'dissent';return'majority'}

function getJustices(){
  const m=new Map();
  ALL.forEach(c=>{const add=n=>{if(!n)return;m.set(n,(m.get(n)||0)+1)};add(c.a);if(c.con)c.con.forEach(add);if(c.dis)c.dis.forEach(add);if(c.maj)c.maj.forEach(n=>{if(n!==c.a)add(n)})});
  return[...m.entries()].sort((a,b)=>b[1]-a[1]);
}

function filter(){
  let f=ALL;
  if(state.ia)f=f.filter(c=>c.ia===state.ia);
  if(state.era)f=f.filter(c=>c.ch===state.era);
  if(state.justice)f=f.filter(c=>matchJ(c,state.justice));
  if(state.query){const q=state.query.toLowerCase();f=f.filter(c=>c.n.toLowerCase().includes(q)||(c.holding&&c.holding.toLowerCase().includes(q))||(c.a&&c.a.toLowerCase().includes(q))||String(c.t).includes(q)||(IA_NAMES[c.ia]&&IA_NAMES[c.ia].toLowerCase().includes(q)))}
  if(state.justice)f.sort((a,b)=>{const x=a.a===state.justice?1:0,y=b.a===state.justice?1:0;if(y!==x)return y-x;return(b.landmark?1:0)-(a.landmark?1:0)||b.t-a.t});
  else if(state.sort==='year-desc')f.sort((a,b)=>b.t-a.t);
  else if(state.sort==='year-asc')f.sort((a,b)=>a.t-b.t);
  else f.sort((a,b)=>(b.landmark?1:0)-(a.landmark?1:0)||(b.featured?1:0)-(a.featured?1:0)||b.t-a.t);
  return f;
}

function cleanName(n){
  if(n!==n.toUpperCase())return n;
  const skip=['V.','ET','AL.','OF','THE','AND','IN','FOR','INC.','CO.','CORP.','LLC','NO.','A','AN','ON','TO','BY','AS','OR','AT'];
  n=n.replace(/\b\w+/g,w=>skip.includes(w)?w.toLowerCase():w.charAt(0)+w.slice(1).toLowerCase());
  return n.charAt(0).toUpperCase()+n.slice(1).replace(/ V\. /g,' v. ').replace(/ Et /g,' et ').replace(/ Al\./g,' al.');
}

function renderFilters(){
  const el=document.getElementById('filters');
  const iac={};ALL.forEach(c=>{iac[c.ia]=(iac[c.ia]||0)+1});
  let h='<div class="filter-group"><span class="filter-label">Topic</span>';
  h+=`<button class="pill ${!state.ia?'active':''}" data-ia="">All</button>`;
  [1,2,3,4,5,8,9,10,7,12].forEach(ia=>{
    const nm=IA_NAMES[ia];const sh=nm.length>14?nm.substring(0,12)+'.':nm;
    h+=`<button class="pill ${state.ia===ia?'active':''}" data-ia="${ia}">${sh} <span class="ct">${iac[ia]||0}</span></button>`;
  });
  h+='</div><div class="filter-sep"></div><div class="filter-group"><span class="filter-label">Era</span>';
  h+=`<button class="pill ${!state.era?'active':''}" data-era="">All</button>`;
  Object.entries(ERAS).forEach(([ch,yr])=>{h+=`<button class="pill ${state.era===ch?'active':''}" data-era="${ch}">${ch} <span class="ct">${yr}</span></button>`});
  h+='</div><div class="filter-sep"></div><div class="filter-group"><span class="filter-label">Justice</span>';
  h+=`<button class="pill ${!state.justice?'active':''}" data-j="">All</button>`;
  getJustices().slice(0,15).forEach(([nm,ct])=>{h+=`<button class="pill ${state.justice===nm?'active':''}" data-j="${nm}">${nm} <span class="ct">${ct}</span></button>`});
  h+='</div>';
  el.innerHTML=h;
}

function renderCard(c){
  const color=IA_COLORS[c.ia]||'#888';
  const exp=state.expanded===c.id;
  let badges='';
  if(c.landmark)badges+='<span class="badge badge-landmark">Landmark</span>';
  if(c.overruled)badges+='<span class="badge badge-overruled">Overruled</span>';
  if(c.t>=2020&&!c.landmark&&!c.featured)badges+='<span class="badge badge-recent">Recent</span>';
  if(state.justice){const r=roleJ(c,state.justice);badges+=`<span class="badge-role role-${r}">${r}</span>`}
  const name=cleanName(c.n);
  let det='';
  if(exp){
    if(c.holding)det+=`<div class="det-row"><span class="det-label">Holding</span><span class="det-val"><em>${c.holding}</em></span></div>`;
    det+=`<div class="det-row"><span class="det-label">Decision</span><span class="det-val">${c.v} · ${c.a||'Per Curiam'}${c.dir?' · '+c.dir:''}</span></div>`;
    if(c.con&&c.con.length)det+=`<div class="det-row"><span class="det-label">Concurrences</span><span class="det-val">${c.con.join(', ')}</span></div>`;
    if(c.dis&&c.dis.length)det+=`<div class="det-row"><span class="det-label">Dissents</span><span class="det-val">${c.dis.join(', ')}</span></div>`;
    det+=`<div class="det-row"><span class="det-label">Citation</span><span class="det-val">${c.c}</span></div>`;
    if(c.overruled)det+=`<div class="det-row"><span class="det-label">Overruled</span><span class="det-val" style="color:#b84040">${c.overruled}</span></div>`;
    const p=c.c.match(/(\d+)\s+U\.S\.\s+(\d+)/);
    if(p)det+=`<div class="det-links"><a href="https://supreme.justia.com/cases/federal/us/${p[1]}/${p[2]}/" target="_blank">Justia</a><a href="https://www.law.cornell.edu/supremecourt/text/${p[1]}US${p[2]}" target="_blank">Cornell LII</a></div>`;
  }
  const yr=c.d?c.d.substring(0,4):c.t;
  return`<div class="card ${c.featured?'featured':''} ${exp?'expanded':''}" data-id="${c.id}" style="--card-accent:${color}">${badges?'<div class="card-badges">'+badges+'</div>':''}<div class="card-name">${name}</div><div class="card-meta"><span class="yr">${yr}</span><span class="dot">·</span><span>${c.v}</span>${c.a?'<span class="dot">·</span><span>'+c.a+'</span>':''}</div>${c.holding?'<div class="card-holding">'+c.holding+'</div>':''}<div class="card-tag">${IA_NAMES[c.ia]||''}</div>${det?'<div class="card-details">'+det+'</div>':''}</div>`;
}

function renderGrid(){
  const f=filter();
  const shown=f.slice(0,(state.page+1)*PAGE);
  const el=document.getElementById('main');
  let label='';
  if(state.ia)label+=' in '+IA_NAMES[state.ia];
  if(state.justice)label+=' involving '+state.justice;
  if(state.era)label+=' · '+state.era+' Court';
  document.getElementById('stats').innerHTML=`<strong>${f.length.toLocaleString()}</strong> cases${label}`;
  if(!f.length){el.innerHTML='<div class="no-results">No cases match your filters</div>';return}
  let h='<div class="cases-grid">';
  shown.forEach(c=>{h+=renderCard(c)});
  h+='</div>';
  if(shown.length<f.length)h+=`<div class="load-more"><button class="pill" id="load-more">Show more (${(f.length-shown.length).toLocaleString()} remaining)</button></div>`;
  el.innerHTML=h;
}

function renderJP(){
  const el=document.getElementById('jp');
  if(!state.justice){el.classList.remove('show');return}
  const j=state.justice;const cases=ALL.filter(c=>matchJ(c,j));
  let a=0,co=0,di=0;cases.forEach(c=>{const r=roleJ(c,j);if(r==='author')a++;else if(r==='concurrence')co++;else if(r==='dissent')di++});
  document.getElementById('jp-inner').innerHTML=`<h2>Justice ${j}</h2><div class="jp-meta">${cases.length} cases in database</div><div class="jp-stats"><div class="jp-stat"><strong>${a}</strong> <span>Authored</span></div><div class="jp-stat"><strong>${co}</strong> <span>Concurrences</span></div><div class="jp-stat"><strong>${di}</strong> <span>Dissents</span></div></div>`;
  el.classList.add('show');
}

function render(){renderFilters();renderGrid();renderJP();
  const d=document.getElementById('doctrine');
  if(state.ia&&DOCTRINE[state.ia]){document.getElementById('doctrine-text').innerHTML=DOCTRINE[state.ia];d.classList.add('show')}else{d.classList.remove('show')}
}

function init(){
  document.getElementById('loading').remove();
  render();
  document.getElementById('filters').addEventListener('click',e=>{
    const p=e.target.closest('.pill');if(!p)return;
    if(p.dataset.ia!==undefined)state.ia=p.dataset.ia?parseInt(p.dataset.ia):null;
    else if(p.dataset.era!==undefined)state.era=p.dataset.era||null;
    else if(p.dataset.j!==undefined)state.justice=p.dataset.j||null;
    state.page=0;state.expanded=null;render();
  });
  document.getElementById('main').addEventListener('click',e=>{
    if(e.target.closest('a'))return;
    const card=e.target.closest('.card');
    if(card){
      const id=card.dataset.id;
      state.expanded=state.expanded===id?null:id;
      // Re-render to show/hide details
      renderGrid();
      return;
    }
    if(e.target.id==='load-more'){state.page++;renderGrid()}
  });
  let searchTimer;
  document.getElementById('search').addEventListener('input',e=>{
    clearTimeout(searchTimer);
    searchTimer=setTimeout(()=>{state.query=e.target.value.trim();state.page=0;state.expanded=null;renderGrid()},150);
  });
  document.getElementById('sort').addEventListener('change',e=>{state.sort=e.target.value;state.page=0;renderGrid()});
}

loadData();
</script>
</body>
</html>
